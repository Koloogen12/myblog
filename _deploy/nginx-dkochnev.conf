# dkochnev.com — Vite SPA (React + Vite + Supabase external backend).
# Static dist served by nginx. Mirrors demo.makemelook.tech pattern.
# Lives at: /etc/nginx/sites-available/dkochnev (linked into sites-enabled).
# Updated via _deploy/deploy.sh from local Mac.

server {
    listen 80;
    listen [::]:80;
    server_name dkochnev.com www.dkochnev.com;

    # ACME (kept available on :80 even after SSL added by certbot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # certbot adds: return 301 https://$host$request_uri; for non-ACME paths

    root /opt/dkochnev/site;
    index index.html;

    location ~* \.(js|css|woff2|svg|png|jpg|jpeg|webp|ico)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}

# certbot --nginx will append/manage an analogous :443 server block + redirect.
