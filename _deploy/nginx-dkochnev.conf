# dkochnev.com — Vite SPA (React + Vite). Backend = Supabase (proxied to dodge
# Russian ISP blocks of *.supabase.co). Updated 2026-05-16.

# WebSocket upgrade map (used by /supabase/realtime/v1 for realtime).
map $http_upgrade $dkochnev_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    server_name dkochnev.com www.dkochnev.com;

    # ACME challenge for certbot (kept on :80 even after SSL added)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    root /opt/dkochnev/site;
    index index.html;

    # ============================================================
    # Supabase reverse proxy: dkochnev.com/supabase/* → supabase.co/*
    # ------------------------------------------------------------
    # Reasons we proxy server-side:
    #   1) Some Russian ISPs intermittently block *.supabase.co — bypassing
    #      that lookup on the user's side and reaching Supabase from our
    #      Selectel server (clean white IP) restores access without VPN.
    #   2) Same-origin removes any CORS friction and keeps cookies sane.
    #
    # Path mapping:    /supabase/rest/v1/foo  →  https://<project>.supabase.co/rest/v1/foo
    # WebSockets:      proxied with HTTP/1.1 + Upgrade headers for realtime.
    # ============================================================
    # `^~` makes this prefix beat the asset-cache regex location below,
    # so /supabase/storage/.../file.png correctly hits the proxy.
    location ^~ /supabase/ {
        # Strip the /supabase prefix and forward the rest to the project host.
        # Trailing slash on proxy_pass tells nginx to strip the matched location prefix.
        proxy_pass https://mxttoiqtviaobotoekxw.supabase.co/;

        # Pretend to be the supabase host so their router & SNI work correctly.
        proxy_ssl_server_name on;
        proxy_ssl_name mxttoiqtviaobotoekxw.supabase.co;
        proxy_set_header Host mxttoiqtviaobotoekxw.supabase.co;

        # Pass through original client IP for Supabase rate-limiting/logs.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;

        # WebSockets (realtime) need HTTP/1.1 + Upgrade.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $dkochnev_connection_upgrade;

        # Rewrite Set-Cookie domain so __cf_bm sticks on dkochnev.com.
        proxy_cookie_domain mxttoiqtviaobotoekxw.supabase.co dkochnev.com;

        # Don't buffer SSE / streaming.
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Tiny safety net: keep upload payloads reasonable (matches Supabase default).
        client_max_body_size 50m;
    }

    # Cache hashed Vite assets aggressively (filenames contain content hashes)
    location ~* \.(js|css|woff2|svg|png|jpg|jpeg|webp|ico)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # SPA fallback for client-side routing (/admin/*, /blog/*, etc.)
    # The root needs its own rule: `index index.html` resolves "/" to the SPA
    # shell before try_files can fall through to the bot branch below.
    location = / {
        if ($dkochnev_is_bot) {
            rewrite ^ /prerender/index.html last;
        }
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
    }

    # Crawlers get a prerendered snapshot with real text; humans get the SPA.
    # $dkochnev_is_bot comes from conf.d/dkochnev-prerender-map.conf.
    location / {
        try_files $uri $uri/ @spa_or_bot;
        add_header Cache-Control "no-cache" always;
    }

    location @spa_or_bot {
        if ($dkochnev_is_bot) {
            rewrite ^/$ /prerender/index.html last;
        }
        if ($dkochnev_is_bot) {
            rewrite ^(.+?)/?$ /prerender$1.html last;
        }
        rewrite ^ /index.html last;
    }

    # Snapshots are reachable only through the rewrite above, never directly,
    # so they cannot show up as duplicate URLs in the index.
    location /prerender/ {
        internal;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/dkochnev.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/dkochnev.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot



}

server {
    if ($host = www.dkochnev.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = dkochnev.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name dkochnev.com www.dkochnev.com;
    return 404; # managed by Certbot




}
