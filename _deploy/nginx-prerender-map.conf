# Serve prerendered HTML to crawlers, the SPA to humans.
#
# The app renders client-side, so the shell nginx normally serves contains no
# text. Google indexes that only on a second, delayed pass, and AI answer
# engines (GPTBot, PerplexityBot, ClaudeBot) do not run JavaScript at all — so
# without this they see an empty page and can never cite the blog.
#
# Snapshots are built from the same database the app reads
# (/usr/local/sbin/dkochnev-prerender, hourly cron), so bot and human get
# identical content. That is dynamic rendering, not cloaking.

map $http_user_agent $dkochnev_is_bot {
    default 0;

    # Search engines
    "~*googlebot|bingbot|yandex(bot|webmaster)|duckduckbot|baiduspider|slurp"  1;

    # AI answer engines — the reason this exists
    "~*gptbot|chatgpt-user|oai-searchbot|perplexitybot|perplexity-user"        1;
    "~*claudebot|claude-user|anthropic-ai|google-extended|applebot|amazonbot"  1;
    "~*meta-externalagent|bytespider|youbot|diffbot|cohere-ai"                 1;

    # Link previews (Telegram, socials) — same fix, visible benefit
    "~*twitterbot|facebookexternalhit|telegrambot|slackbot|discordbot"         1;
    "~*linkedinbot|whatsapp|vkshare|skypeuripreview|embedly"                   1;
}
